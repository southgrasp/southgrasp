<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>LANDAY Logo</title>
<style>body{margin:0;background:#F4F1EA;font-family:sans-serif;color:#5A6652}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px}
.card{background:#fff;border-radius:12px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.card.dark{background:#232C25}.card img{max-width:100%}
small{font-size:12px;letter-spacing:.08em}</style></head><body><div class="grid">
<div class="card"><img src="landay-logo-horizontal.svg" width="413"><small>Horizontal</small></div>
<div class="card"><img src="landay-logo-vertical.svg" width="187"><small>Vertical</small></div>
<div class="card"><img src="landay-symbol.svg" width="120"><small>Symbol</small></div>
<div class="card"><img src="landay-logo-horizontal-mono.svg" width="413"><small>Mono</small></div>
<div class="card dark" style="grid-column:span 2"><img src="landay-logo-horizontal-reverse.svg" width="413"><small style="color:#9AAD8E">Reverse</small></div>
</div></body></html>
